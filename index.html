<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Count Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Crimson+Pro:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #1a1f3a;
      --accent-warm: #ff6b35;
      --accent-cool: #4ecdc4;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --border: #2a2f4a;
    }

    body {
      font-family: 'Crimson Pro', serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1535 100%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(78, 205, 196, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInDown 0.8s ease-out;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-warm), var(--accent-cool));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      font-weight: 300;
    }

    .writers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .writer-card {
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .writer-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-warm), var(--accent-cool));
    }

    .writer-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .writer-name {
      font-family: 'Space Mono', monospace;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .writer-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .writer-1 .writer-icon {
      background: var(--accent-warm);
    }

    .writer-2 .writer-icon {
      background: var(--accent-cool);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .add-words-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    input[type="number"] {
      flex: 1;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent-warm);
    }

    button {
      background: linear-gradient(135deg, var(--accent-warm), var(--accent-cool));
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      color: white;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      font-size: 0.9rem;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-warm), var(--accent-cool));
      transition: width 0.5s ease;
      border-radius: 4px;
    }

    .comparison-section {
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .comparison-title {
      font-family: 'Space Mono', monospace;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .comparison-bars {
      display: flex;
      gap: 2rem;
      align-items: flex-end;
      justify-content: center;
      height: 200px;
      margin-bottom: 1rem;
    }

    .comparison-bar {
      flex: 1;
      max-width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .bar-container {
      width: 100%;
      background: var(--bg-primary);
      border-radius: 8px 8px 0 0;
      position: relative;
      transition: height 0.6s ease;
      min-height: 20px;
    }

    .bar-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-radius: 8px 8px 0 0;
      transition: height 0.6s ease;
    }

    .bar-1 .bar-fill {
      background: linear-gradient(180deg, var(--accent-warm), rgba(255, 107, 53, 0.6));
    }

    .bar-2 .bar-fill {
      background: linear-gradient(180deg, var(--accent-cool), rgba(78, 205, 196, 0.6));
    }

    .bar-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .bar-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 0.5rem;
    }

    .motivation-message {
      text-align: center;
      font-size: 1.1rem;
      color: var(--accent-cool);
      margin-top: 1.5rem;
      font-weight: 600;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    .month-selector {
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .month-title {
      font-family: 'Space Mono', monospace;
      font-size: 1.5rem;
    }

    .month-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .month-nav-btn {
      background: var(--bg-primary);
      border: 2px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      min-width: 40px;
    }

    .month-nav-btn:hover {
      border-color: var(--accent-cool);
    }

    .current-month {
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
      color: var(--accent-cool);
      padding: 0 1rem;
      min-width: 150px;
      text-align: center;
    }

    .month-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .month-stat-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .month-stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .month-stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .reset-section {
      margin-top: 2rem;
      text-align: center;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    .reset-button {
      background: linear-gradient(135deg, #e63946, #d62828);
      font-size: 0.85rem;
      padding: 0.6rem 1.2rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .writers-grid {
        grid-template-columns: 1fr;
      }

      .comparison-bars {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✍️ Word Warriors</h1>
      <p class="subtitle">Track your writing journey together</p>
    </header>

    <div class="month-selector">
      <div class="month-header">
        <h2 class="month-title">📅 Month View</h2>
        <div class="month-controls">
          <button class="month-nav-btn" onclick="changeMonth(-1)">←</button>
          <div class="current-month" id="currentMonth"></div>
          <button class="month-nav-btn" onclick="changeMonth(1)" id="nextMonthBtn">→</button>
        </div>
      </div>
      <div class="month-stats" id="monthStats">
        <!-- Month stats will be inserted here -->
      </div>
    </div>

    <div class="writers-grid" id="writersGrid">
      <!-- Writer cards will be inserted here -->
    </div>

    <div class="comparison-section">
      <h2 class="comparison-title">This Month's Progress</h2>
      <div class="comparison-bars" id="comparisonBars">
        <!-- Comparison bars will be inserted here -->
      </div>
      <div class="motivation-message" id="motivationMessage"></div>
    </div>

    <div class="reset-section">
      <button class="reset-button" onclick="resetCurrentMonth()">Reset Current Month</button>
    </div>
  </div>

  <script>
    const GOAL = 5000; // Monthly word goal

    // Initialize current view month
    let currentViewDate = new Date();
    
    // Initialize writers data with proper names
    let allMonthsData = {};

    // Get month key for storage
    function getMonthKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    // Get current month data
    function getCurrentMonthData() {
      const monthKey = getMonthKey(currentViewDate);
      if (!allMonthsData[monthKey]) {
        allMonthsData[monthKey] = {
          writer1: { name: 'Adrian', words: 0, icon: '🔥' },
          writer2: { name: 'Abhinav', words: 0, icon: '⚡' }
        };
      }
      return allMonthsData[monthKey];
    }

    // Format month for display
    function formatMonth(date) {
      return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    // Check if viewing current month
    function isCurrentMonth() {
      const now = new Date();
      return getMonthKey(now) === getMonthKey(currentViewDate);
    }

    // Change month view
    function changeMonth(direction) {
      const newDate = new Date(currentViewDate);
      newDate.setMonth(newDate.getMonth() + direction);
      
      // Don't allow future months
      const now = new Date();
      if (newDate > now) {
        return;
      }
      
      currentViewDate = newDate;
      renderApp();
    }

    // Load data from storage
    async function loadData() {
      try {
        const result = await window.storage.get('word-tracker-all-data', true);
        if (result && result.value) {
          allMonthsData = JSON.parse(result.value);
        }
      } catch (error) {
        console.log('No existing data, starting fresh');
      }
      renderApp();
    }

    // Save data to storage
    async function saveData() {
      try {
        await window.storage.set('word-tracker-all-data', JSON.stringify(allMonthsData), true);
      } catch (error) {
        console.error('Error saving data:', error);
      }
    }

    // Add words for a writer
    async function addWords(writerId) {
      if (!isCurrentMonth()) {
        alert('You can only add words to the current month!');
        return;
      }

      const input = document.getElementById(`input-${writerId}`);
      const words = parseInt(input.value) || 0;
      
      if (words > 0) {
        const monthData = getCurrentMonthData();
        monthData[writerId].words += words;
        await saveData();
        input.value = '';
        renderApp();
      }
    }

    // Reset current month
    async function resetCurrentMonth() {
      if (!isCurrentMonth()) {
        alert('You can only reset the current month!');
        return;
      }

      if (confirm('Are you sure you want to reset this month\'s word counts?')) {
        const monthKey = getMonthKey(currentViewDate);
        allMonthsData[monthKey] = {
          writer1: { name: 'Adrian', words: 0, icon: '🔥' },
          writer2: { name: 'Abhinav', words: 0, icon: '⚡' }
        };
        await saveData();
        renderApp();
      }
    }

    // Get motivation message
    function getMotivationMessage(writers) {
      const total = writers.writer1.words + writers.writer2.words;
      const diff = Math.abs(writers.writer1.words - writers.writer2.words);
      const leader = writers.writer1.words > writers.writer2.words ? writers.writer1.name : writers.writer2.name;
      
      if (total === 0) {
        return "Let's start writing!";
      } else if (total >= GOAL * 2) {
        return "Amazing! You've both crushed your goals!";
      } else if (diff < 500) {
        return "Neck and neck! Keep pushing!";
      } else {
        return `${leader} is in the lead, but anything can happen!`;
      }
    }

    // Calculate all-time stats
    function calculateAllTimeStats() {
      let adrian = 0;
      let abhinav = 0;
      let months = 0;

      for (const monthKey in allMonthsData) {
        const monthData = allMonthsData[monthKey];
        adrian += monthData.writer1.words;
        abhinav += monthData.writer2.words;
        months++;
      }

      return { adrian, abhinav, months, total: adrian + abhinav };
    }

    // Render the app
    function renderApp() {
      const writers = getCurrentMonthData();
      const isEditable = isCurrentMonth();

      // Update month display
      document.getElementById('currentMonth').textContent = formatMonth(currentViewDate);
      
      // Disable next button if viewing current month
      const nextBtn = document.getElementById('nextMonthBtn');
      if (isCurrentMonth()) {
        nextBtn.disabled = true;
        nextBtn.style.opacity = '0.5';
        nextBtn.style.cursor = 'not-allowed';
      } else {
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        nextBtn.style.cursor = 'pointer';
      }

      // Render month stats
      const allTimeStats = calculateAllTimeStats();
      const monthStats = document.getElementById('monthStats');
      monthStats.innerHTML = `
        <div class="month-stat-card">
          <div class="month-stat-label">Total Words This Month</div>
          <div class="month-stat-value">${(writers.writer1.words + writers.writer2.words).toLocaleString()}</div>
        </div>
        <div class="month-stat-card">
          <div class="month-stat-label">All-Time Total</div>
          <div class="month-stat-value">${allTimeStats.total.toLocaleString()}</div>
        </div>
        <div class="month-stat-card">
          <div class="month-stat-label">Months Tracked</div>
          <div class="month-stat-value">${allTimeStats.months}</div>
        </div>
      `;

      // Render writer cards
      const writersGrid = document.getElementById('writersGrid');
      writersGrid.innerHTML = Object.entries(writers).map(([id, writer], index) => {
        const progress = (writer.words / GOAL) * 100;
        const inputSection = isEditable ? `
          <div class="add-words-section">
            <div class="input-group">
              <input type="number" id="input-${id}" placeholder="Words written today" min="0">
              <button onclick="addWords('${id}')">Add</button>
            </div>
          </div>
        ` : `
          <div class="add-words-section">
            <div style="text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
              Viewing past month (read-only)
            </div>
          </div>
        `;

        return `
          <div class="writer-card writer-${index + 1}">
            <div class="writer-name">
              <span class="writer-icon">${writer.icon}</span>
              <span>${writer.name}</span>
            </div>
            <div class="stats-row">
              <span class="stat-label">This Month</span>
              <span class="stat-value">${writer.words.toLocaleString()}</span>
            </div>
            <div class="stats-row">
              <span class="stat-label">Goal Progress</span>
              <span class="stat-value">${Math.round(progress)}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${Math.min(progress, 100)}%"></div>
            </div>
            ${inputSection}
          </div>
        `;
      }).join('');

      // Render comparison bars
      const maxWords = Math.max(writers.writer1.words, writers.writer2.words) || 1;
      const comparisonBars = document.getElementById('comparisonBars');
      comparisonBars.innerHTML = Object.entries(writers).map(([id, writer], index) => {
        const height = (writer.words / maxWords) * 150;
        return `
          <div class="comparison-bar bar-${index + 1}">
            <div class="bar-container" style="height: ${height}px">
              <div class="bar-fill" style="height: ${height}px"></div>
            </div>
            <div class="bar-label">${writer.name}</div>
            <div class="bar-value">${writer.words.toLocaleString()}</div>
          </div>
        `;
      }).join('');

      // Update motivation message
      document.getElementById('motivationMessage').textContent = getMotivationMessage(writers);
    }

    // Add Enter key support for inputs
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && e.target.type === 'number') {
        const writerId = e.target.id.replace('input-', '');
        addWords(writerId);
      }
    });

    // Initialize app
    loadData();
  </script>
</body>
</html>
